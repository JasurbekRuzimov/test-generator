<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Login - Test Generator</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>

<body class="d-flex flex-column">
<div class="page page-center">
  <div class="container container-tight py-4">
    <div class="text-center mb-4">
      <a th:href="@{/dashboard}" class="navbar-brand navbar-brand-autodark">
        <i class="ti ti-lock me-1"></i> Test Generator
      </a>
    </div>

    <form class="card card-md" method="post" th:action="@{/login}">
      <div class="card-body">
        <h2 class="card-title text-center mb-4">Admin Login</h2>

        <div class="alert alert-danger" role="alert" th:if="${param.error}">
          Login yoki parol noto‘g‘ri!
        </div>

        <div class="alert alert-success" role="alert" th:if="${param.logout}">
          Siz tizimdan chiqdingiz.
        </div>

        <div class="mb-3">
          <label class="form-label">Username</label>
          <input name="username" type="text" class="form-control" placeholder="admin" autocomplete="username" required>
        </div>

        <div class="mb-2">
          <label class="form-label">Password</label>
          <div class="input-group input-group-flat">
            <input name="password" type="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
            <span class="input-group-text">
              <a href="#" class="link-secondary" title="Show password" onclick="togglePwd(event)">
                <i class="ti ti-eye"></i>
              </a>
            </span>
          </div>
        </div>

        <div class="form-footer">
          <button type="submit" class="btn btn-primary w-100">
            <i class="ti ti-login me-1"></i> Sign in
          </button>
        </div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      </div>
    </form>

    <div class="text-center text-secondary mt-3">
      Default: <b>admin</b> / <b>admin123</b>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
<script>
  function togglePwd(e){
    e.preventDefault();
    const input = document.querySelector('input[name="password"]');
    input.type = input.type === 'password' ? 'text' : 'password';
  }
</script>
</body>
</html>
